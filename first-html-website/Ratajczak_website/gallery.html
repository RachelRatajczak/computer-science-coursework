<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" >
        <title>Gallery</title>
        
        <style>
            * {
                box-sizing: border-box;
            }

            body {
                background-color: #eee8e8;
            }

            .row::after {
                content: "";
                clear: both;
                display: table;
            }

            [class*="col-"] {
                float: left;
                padding: 15px;
            }   

            /* For mobile phones: */
                [class*="col-"] {
                width: 100%;
            }

            /* For tablets */
            @media only screen and (min-width: 768px) {
                .col-s-1 {width: 8.33%;}
                .col-s-2 {width: 16.66%;}
                .col-s-3 {width: 25%;}
                .col-s-4 {width: 33.33%;}
                .col-s-5 {width: 41.66%;}
                .col-s-6 {width: 50%;}
                .col-s-7 {width: 58.33%;}
                .col-s-8 {width: 66.66%;}
                .col-s-9 {width: 75%;}
                .col-s-10 {width: 83.33%;}
                .col-s-11 {width: 91.66%;}
                .col-s-12 {width: 100%;}
            }

             /* For desktop: */
            @media only screen and (min-width: 992px) {
                .col-1 {width: 8.33%;}
                .col-2 {width: 16.66%;}
                .col-3 {width: 25%;}
                .col-4 {width: 33.33%;}
                .col-5 {width: 41.66%;}
                .col-6 {width: 50%;}
                .col-7 {width: 58.33%;}
                .col-8 {width: 66.66%;}
                .col-9 {width: 75%;}
                .col-10 {width: 83.33%;}
                .col-11 {width: 91.66%;}
                .col-12 {width: 100%;}
            }

            /* nav Bar */
            @media screen and (max-width: 600px){
                ul.navBar li {
                    float: none;  
                    width: 100%;  
                    text-align: left;  
                }

                ul.navBar li.right {
                    float: none; 
                }

                ul.navBar li a {
                    padding: 10px 15px;  
                }
            }
            

            html {
                font-family: Georgia, 'Times New Roman', Times, serif;
            }

            .header {
                padding: 10px;
                color: #000000;
                text-align: center;
                vertical-align: text-top; 
                background-image: url('gallery/banner.png');
                background-size: cover;
                background-position: center;
                height: 150px; 
                display: flex; 
                flex-direction: column; 
                justify-content: flex-start; 
                text-align: center; 
            }

            ul.navBar {
                list-style-type: none;
                margin: 5px;
                padding: 0;
                overflow: hidden;
                background-color: #ddadad;
            }

            ul.navBar li{float: left;}

            ul.navBar li a{
                display: block;
                color: #000000;
                text-align: center;
                padding: 14px 16px;
                text-decoration: none;
            }

            ul.navBar li a:hover:not(.active){
                background-color: #d6c7c7;
            }

            ul.navBar li a.active {
                background-color: #d6c7c7;
            }

            ul.navBar li.right {
                float: right;
            }

            .footer {
                background-color: #d6c7c7;
                display: flex;
                align-items: center; 
                text-align: left;
                flex-wrap: wrap; 
                gap: 10px; 
                color: #000000;
                text-align: left;
                font-size: 12px;
                padding: 15px;
                clear: both; 
            }

            .footer img {
                max-width: 100%; 
                height: auto; 
                width: 150px; 
                margin-right: 10px; 
            }

            .footer ul {
                list-style-type: none;
            }

            .gallery {
                display: grid;
                grid-template-columns: repeat(4, 1fr);
                grid-auto-rows: auto;
                grid-auto-flow: dense;
                gap: 6px;
            }

            img {
                width: 100%;
                height: 100%;
                object-fit: cover;
            }

            img.four-grid-cells {
                grid-row: span 2 / auto;
                grid-column: span 2 / auto;
            }

            img.wide-image {
                grid-column: span 2 / auto;
            }

        </style>
    </head>
